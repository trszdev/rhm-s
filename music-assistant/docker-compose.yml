services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - tailscale-config:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-music-assistant}
      - TS_ACCEPT_DNS=true
      - TS_SERVICES={"tcp":{"443":[{"port":8095,"tls":true}]}}
    command:
      - start

  music-assistant:
    image: ghcr.io/sproft/ytmusic-free-provider:latest
    container_name: music-assistant
    restart: unless-stopped
    ports:
      - "8095:8095"
      - "8096:8096/udp"
    volumes:
      - ma-config:/config
      - ma-media:/media

volumes:
  tailscale-config:
  ma-config:
  ma-media:
