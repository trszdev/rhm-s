# Бэкенд для Amperfy: Subsonic API поверх YouTube Music с входом в аккаунт по куки
# (music-play), доступ по HTTPS через Tailscale.
#
# Схема:
#   - tailscale — отдельный узел tailnet (имя TS_HOSTNAME). tailscale serve принимает
#     https://<имя>.<tailnet>.ts.net:443 и проксирует на http://music-play:5080.
#     Сертификат выдаёт и продлевает Tailscale;
#   - music-play — Subsonic-сервер. Плейлисты аккаунта читает через ytmusicapi,
#     поток получает через yt-dlp. Образ собирается из ./Dockerfile;
#   - у контейнеров общая внутренняя сеть, но НЕ общий network_mode. В userspace-режиме
#     tailscaled перенаправляет входящие порты узла на свой 127.0.0.1, поэтому при общем
#     сетевом пространстве порт 5080 был бы открыт в tailnet без TLS. Порты на хост
#     тоже не публикуются.
#
# Куки задаются переменной YTM_COOKIES в настройках стека, в git их не добавлять.
# При каждом запуске они записываются в том music-play-config. Формат: см. .env.example.
#
# Кеш: аудио лежит только в tmpfs (память) и занимает не больше 512 МБ, старые треки
# вытесняются новыми, при перезапуске контейнера кеш очищается целиком.
#
# В админке Tailscale должны быть включены MagicDNS и HTTPS Certificates.
#
# Запуск через Portainer: переменные из .env.example задаются в настройках стека.
# Запуск вручную: заполнить .env, затем docker compose up -d
#
# Когда YouTube ломает извлечение потоков, нужен свежий yt-dlp. Он ставится при сборке
# и остаётся в кеше, поэтому очисти кеш на сервере и задеплой заново: docker builder prune -f

services:
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Auth key нужен при первом входе; дальше идентичность хранится в tailscale-config
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-music}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      # Tailscale эту переменную не читает. Compose не пересоздаёт контейнер при смене
      # inline-конфига, поэтому при смене адреса в ts-serve её тоже нужно менять.
      - TS_SERVE_TARGET=music-play:5080
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - tailscale-config:/var/lib/tailscale
    networks:
      - backend

  music-play:
    build: .
    # Образа нет в реестрах, поэтому pull пропускается, а при каждом деплое образ собирается.
    # Неизменившиеся шаги берутся из кеша сборки.
    pull_policy: build
    container_name: music-play
    restart: unless-stopped
    environment:
      # Логин и пароль, которые вводятся в Amperfy. С аккаунтом Google не связаны.
      - SUBSONIC_USER=${SUBSONIC_USER:-admin}
      - SUBSONIC_PASSWORD=${SUBSONIC_PASSWORD:?Задай SUBSONIC_PASSWORD}
      # Код страны, из которой сервер выходит в YouTube.
      - YTM_LOCATION=${REGION:?Задай REGION, например DE}
      # Только en: с ru ytmusicapi находит 0 песен и теряет альбомы
      - YTM_LANGUAGE=en
      # Куки аккаунта. start.py создаёт из них оба файла ниже
      - YTM_COOKIES=${YTM_COOKIES:-}
      - YTM_AUTH_FILE=/config/ytmusic_auth.json
      - YTDLP_COOKIE_FILE=/config/cookies.txt
      - STREAM_MODE=proxy
      - CACHE_ENABLED=true
      - CACHE_MAX_GB=0.5
      - TRANSCODE_TO_AAC=true
      # Внешние сервисы, которые для музыки из аккаунта не нужны
      - SPONSORBLOCK=false
      - RETURN_YOUTUBE_DISLIKE=false
      - TRANSLATE_PROVIDER=none
      - HOME=/tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # start.py читает cookies.txt, загруженный через docker cp с чужим владельцем и правами 600
      - DAC_READ_SEARCH
    tmpfs:
      - /cache:size=768m
      - /tmp:size=256m
      - /logs:size=64m
    # yt-dlp запускает Deno. По данным проекта, при лимите ниже 512 МБ его убивает ядро.
    mem_limit: 2g
    volumes:
      # База библиотеки, пароль и куки YouTube
      - music-play-config:/config
    networks:
      - backend

configs:
  ts-serve:
    # $$ — экранирование для compose. ${TS_CERT_DOMAIN} подставляет сам контейнер tailscale.
    content: |
      {
        "TCP": {
          "443": {
            "HTTPS": true
          }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://music-play:5080"
              }
            }
          }
        }
      }

networks:
  backend:

volumes:
  tailscale-config:
  music-play-config:
