# Seafile для локального запуска с периодическим бекапом на Яндекс.Диск.
#
# Схема:
#   - tailscale — отдельный узел tailnet (имя TS_HOSTNAME). tailscale serve принимает
#                 https://<имя>.<tailnet>.ts.net:443 и проксирует на http://seafile:80.
#                 Сертификат выдаёт и продлевает Tailscale;
#   - seafile   — Seafile Server (образ seafileltd/seafile-mc). Порты на хост не публикуются,
#                 доступ только из tailnet;
#   - db        — MariaDB для баз ccnet_db, seafile_db, seahub_db. Порт наружу не публикуется;
#   - memcached — кеш для Seafile;
#   - backup    — раз в BACKUP_INTERVAL_HOURS снимает дамп баз и синхронизирует файлы
#                 Seafile на Яндекс.Диск по WebDAV (rclone). Монтирует тома Seafile
#                 только для чтения.
#
# Данные лежат в именованных томах seafile-data и db-data, а не в папках проекта.
#
# В админке Tailscale должны быть включены MagicDNS и HTTPS Certificates.
#
# Запуск: cp .env.example .env, заполнить .env, затем docker compose up -d --build
# Подробности и настройка квоты: см. README.md

name: seafile

services:
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Auth key нужен при первом входе; дальше идентичность хранится в tailscale-config
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-sync}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - tailscale-config:/var/lib/tailscale
    networks:
      - seafile-net

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?Задай DB_ROOT_PASSWORD в .env}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - seafile-net

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["-m", "256"]
    networks:
      - seafile-net

  seafile:
    image: seafileltd/seafile-mc:11.0-latest
    restart: unless-stopped
    depends_on:
      - db
      - memcached
    environment:
      - DB_HOST=db
      - DB_ROOT_PASSWD=${DB_ROOT_PASSWORD:?Задай DB_ROOT_PASSWORD в .env}
      - MEMCACHED_HOST=memcached
      - TIME_ZONE=${TZ:-Etc/UTC}
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL:?Задай SEAFILE_ADMIN_EMAIL в .env}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD:?Задай SEAFILE_ADMIN_PASSWORD в .env}
      # Публичный адрес в tailnet: <TS_HOSTNAME>.<tailnet>.ts.net. Seafile использует его в ссылках.
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_SERVER_HOSTNAME:?Задай SEAFILE_SERVER_HOSTNAME в .env}
      - SEAFILE_SERVER_LETSENCRYPT=false
      # Снаружи пользователь заходит по https, Tailscale терминирует TLS
      - FORCE_HTTPS_IN_CONF=true
    # Образ пишет SERVICE_URL и FILE_SERVER_ROOT только при первой инициализации тома,
    # а CSRF_TRUSTED_ORIGINS не пишет вовсе. Скрипт seafile-start (ниже, в configs) при каждом
    # старте выставляет все три из SEAFILE_SERVER_HOSTNAME и запускает штатный CMD образа.
    command: ["/bin/sh", "/opt/compose/start.sh"]
    configs:
      - source: seafile-start
        target: /opt/compose/start.sh
    volumes:
      - seafile-data:/shared
    networks:
      - seafile-net

  backup:
    build: ./backup
    # Образа нет в реестрах, поэтому pull пропускается, а образ собирается из ./backup
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?Задай DB_ROOT_PASSWORD в .env}
      - YANDEX_USER=${YANDEX_USER:?Задай YANDEX_USER в .env}
      - YANDEX_APP_PASSWORD=${YANDEX_APP_PASSWORD:?Задай YANDEX_APP_PASSWORD в .env}
      - BACKUP_REMOTE_DIR=${BACKUP_REMOTE_DIR:-seafile-backup}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - BACKUP_DATA=${BACKUP_DATA:-true}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      # Только чтение: бекап не должен менять данные Seafile
      - seafile-data:/source:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Файлы Seafile принадлежат другому пользователю, без этого права root их не прочитает
      - DAC_READ_SEARCH
    networks:
      - seafile-net

configs:
  seafile-start:
    # Скрипт встроен в compose, а не лежит отдельным файлом: Portainer при развёртывании
    # из git не находит файлы по относительным путям на хосте.
    # $$ — экранирование для compose, переменные раскрывает shell внутри контейнера.
    content: |
      #!/bin/sh
      # Образ seafile-mc 11 записывает SERVICE_URL и FILE_SERVER_ROOT в seahub_settings.py
      # один раз, при инициализации пустого тома, и дальше их не трогает. Если адрес потом
      # поменялся (был http://localhost:8080, стал https://<имя>.<tailnet>.ts.net), Seahub
      # продолжает выдавать ссылки для загрузки на старый адрес, и файлы не загружаются.
      # CSRF_TRUSTED_ORIGINS образ не пишет вовсе, и без него Django 4 отвечает 403 на вход:
      # TLS снимает Tailscale, Seahub видит запрос как http, а Origin у браузера https.
      #
      # При каждом старте скрипт пересоздаёт свой блок в конце файла. Python выполняет файл
      # сверху вниз, поэтому значения из блока перекрывают записанные образом выше.
      set -eu

      CONF=/shared/seafile/conf/seahub_settings.py
      BEGIN='# BEGIN seafile-start (docker-compose.yml)'
      END='# END seafile-start'

      url="https://$${SEAFILE_SERVER_HOSTNAME:?SEAFILE_SERVER_HOSTNAME не задан}"

      if [ -f "$$CONF" ]; then
          tmp="$$CONF.tmp"
          # Убираем свой прошлый блок и отдельную строку CSRF_TRUSTED_ORIGINS,
          # которую дописывала прежняя версия этого файла
          sed -e "\|^$$BEGIN|,\|^$$END|d" -e '/^CSRF_TRUSTED_ORIGINS *=/d' "$$CONF" > "$$tmp"
          cat >> "$$tmp" <<EOF
      $$BEGIN, пересоздаётся при каждом старте, правки вручную пропадут
      SERVICE_URL = "$$url"
      FILE_SERVER_ROOT = "$$url/seafhttp"
      CSRF_TRUSTED_ORIGINS = ["$$url"]
      $$END
      EOF
          # Пишем через cat, а не mv, чтобы у файла сохранились владелец и права
          cat "$$tmp" > "$$CONF"
          rm -f "$$tmp"
          echo "seafile-start: адреса Seahub выставлены на $$url"
      else
          echo "seafile-start: $$CONF ещё нет, идёт первая инициализация."
          echo "seafile-start: когда она закончится, перезапусти контейнер seafile один раз"
      fi

      # Штатный CMD образа
      exec /sbin/my_init -- /scripts/enterpoint.sh

  ts-serve:
    # $$ — экранирование для compose. ${TS_CERT_DOMAIN} подставляет сам контейнер tailscale.
    content: |
      {
        "TCP": {
          "443": {
            "HTTPS": true
          }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://seafile:80"
              }
            }
          }
        }
      }

networks:
  seafile-net:

volumes:
  db-data:
  seafile-data:
  tailscale-config:
