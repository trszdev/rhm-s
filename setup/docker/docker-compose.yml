# Portainer за Tailscale: HTTPS на MagicDNS-имени с настоящим сертификатом.
#
# Схема:
#   - контейнер ts — отдельный узел tailnet (своё имя, по умолчанию "portainer");
#   - portainer и ts находятся в общей внутренней сети, порты на хост не публикуются;
#   - tailscale serve из config/serve.json проксирует https://<имя>.<tailnet>.ts.net
#     на https://portainer:9443 и сам выдаёт и продлевает сертификат.
#
# Не используй здесь network_mode: service:ts. В userspace-режиме tailscaled перенаправляет
# входящие порты узла на свой 127.0.0.1, и при общем сетевом пространстве порты Portainer
# (9443, 9000, 8000) стали бы доступны в tailnet в обход serve.
#
# Запуск: cp .env.example .env, заполнить, затем docker compose up -d

name: selfhost

services:
  ts:
    # Для продакшена лучше закрепить версию, например tailscale/tailscale:v1.xx.x
    image: tailscale/tailscale:latest
    environment:
      # Ключ из админки Tailscale (Settings → Keys). Нужен при первом запуске;
      # дальше идентичность хранится в ts-state.
      - TS_AUTHKEY=${TS_AUTHKEY:?Задай TS_AUTHKEY в .env}
      - TS_HOSTNAME=${TS_HOSTNAME:-portainer}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      # Файл serve-конфигурации; каталог ./config монтируется целиком
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./config:/config:ro
    networks:
      - backend
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:lts
    # Порты не публикуем: снаружи доступен только tailscale serve на 443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  ts-state:
  portainer_data:
